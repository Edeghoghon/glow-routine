<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glow Routine</title>
<style>
:root{--mist:#D4DCFF;--iris:#7D83FF;--blue:#007FFF;--mint:#1AFFD5;--wine:#590925;--bg:#0A0B1E;--card:#14163A}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(900px 500px at 50% -10%,#2a2d7a55,transparent),var(--bg);color:var(--mist);min-height:100vh;padding:20px 16px 40px}
.wrap{max-width:460px;margin:auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:18px}
header .txt{padding-bottom:10px}
header img{width:150px;height:auto;flex:none;filter:drop-shadow(0 10px 24px #7d83ff55)}
h1{font-size:1.7rem;line-height:1.15}
h1 span{color:var(--mint)}
header p{opacity:.7;font-size:.9rem;margin-top:6px}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:5px;margin-bottom:14px;border:1px solid #7d83ff33}
.tabs button{flex:1;border:0;background:none;padding:11px;border-radius:999px;font-weight:700;font-size:1rem;color:var(--mist);cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:0 4px 14px #007fff66}
.bar{height:10px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--iris),var(--mint));transition:width .4s}
.msg{font-size:.85rem;margin-bottom:14px;opacity:.75}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer;border:2px solid #7d83ff22;transition:.2s}
.step.done{border-color:var(--mint);opacity:.7}
.pic{width:64px;height:64px;border-radius:14px;background:var(--mist);flex:none;display:grid;place-items:center;overflow:hidden;font-size:1.6rem}
.pic img{width:100%;height:100%;object-fit:contain}
.info{flex:1;min-width:0}
.num{font-size:.7rem;font-weight:800;color:var(--iris);letter-spacing:.08em}
.info b{display:block;font-size:1.05rem;color:#fff}
.info small{display:block;font-size:.78rem;opacity:.7;line-height:1.3;margin-top:2px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--iris);flex:none;display:grid;place-items:center;color:transparent;font-weight:900}
.done .check{background:var(--mint);border-color:var(--mint);color:var(--bg)}
.done b{text-decoration:line-through}
a{color:var(--mint);font-size:.75rem}
footer{text-align:center;font-size:.75rem;opacity:.5;margin-top:18px}
</style>
</head>

  <div class="tabs">
    <button id="tAM" onclick="show('AM')">☀️ Morning</button>
    <button id="tPM" onclick="show('PM')">🌙 Night</button>
  </div>

  <div class="bar"><i id="fill"></i></div>
  <div class="msg" id="msg"></div>
  <div id="list"></div>
  <footer>Tap a step when done · resets every day</footer>
</div>

<script>
/* Put product photos in an "images" folder next to this file, or paste any image URL in `img` below. */
const P={
 cleanser:{name:"Cleanse",prod:"Face Facts Ceramide Hydrating Gentle Cleanser",img:"images/cleanser.jpg",ico:"🫧",tip:"Wet face, massage gently for 60 seconds, rinse with lukewarm water."},
 toner:{name:"Tone",prod:"TONYMOLY Wonder Ceramide Mochi Toner",img:"images/toner.jpg",ico:"💧",tip:"Pat a few drops into skin with clean hands. No rubbing.",link:"https://buybetter.ng/product/tonymoly-wonder-ceramide-mochi-toner-500ml/"},
 moist:{name:"Moisturize",prod:"UNCOVER I Am Smooth Argan Hydrating Moisturiser",img:"images/moisturizer.jpg",ico:"🧴",tip:"A pea-sized amount for face and neck. Seals in hydration.",link:"https://buybetter.ng/product/uncover-i-am-smooth-argan-hydrating-moisturiser-3-38-oz-100ml/"},
 sun:{name:"Sunscreen",prod:"Skin Aqua UV Super Moisture Gel SPF 50+ PA++++",img:"images/sunscreen.jpg",ico:"☀️",tip:"Last step, every morning. Two finger-lengths; reapply if outdoors long.",link:"https://buybetter.ng/product/skin-aqua-uv-super-moisture-gel-spf-50-pa-110g/"}
};
const R={AM:["cleanser","toner","moist","sun"],PM:["cleanser","moist"]};
const day=new Date().toISOString().slice(0,10);
let cur=new Date().getHours()<15?"AM":"PM";
const key=r=>`skin-${day}-${r}`;
const get=r=>{try{return JSON.parse(localStorage.getItem(key(r)))||[]}catch(e){return[]}};
const set=(r,v)=>{try{localStorage.setItem(key(r),JSON.stringify(v))}catch(e){}};
function show(r){cur=r;render()}
function toggle(i){let d=get(cur);d=d.includes(i)?d.filter(x=>x!==i):[...d,i];set(cur,d);render()}
function render(){
  tAM.classList.toggle("on",cur=="AM");tPM.classList.toggle("on",cur=="PM");
  const steps=R[cur],done=get(cur);
  sub.textContent=cur=="AM"?"Morning routine · 4 steps":"Night routine · 2 steps";
  list.innerHTML=steps.map((id,i)=>{const p=P[id],d=done.includes(i);
    return `<div class="step ${d?"done":""}" onclick="toggle(${i})">
      <div class="pic"><img src="${p.img}" alt="" onerror="this.remove()">${p.ico}</div>
      <div class="info"><span class="num">STEP ${i+1}</span><b>${p.name}</b>
      <small>${p.prod}</small><small>${p.tip}</small>
      </div>
      <div class="check">✓</div></div>`}).join("");
  const pct=done.length/steps.length*100;
  fill.style.width=pct+"%";
  msg.textContent=pct==100?"All done. Glowing! ✨":`${done.length} of ${steps.length} done`;
}
render();
</script>
